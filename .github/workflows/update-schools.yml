name: Update schools.json

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate schools.json
        run: |
          python3 -c '
          import json
          from pathlib import Path
          from main import list_schools

          schools = list_schools()

          existing = None
          if Path("schools.json").exists():
              with open("schools.json") as f:
                  existing = json.load(f)

          if existing != schools:
              with open("schools.json", "w") as f:
                  json.dump(schools, f, indent=2)
                  f.write("\n")
              print("updated")
          else:
              print("unchanged")
          '

      - name: Commit if changed
        run: |
          git add schools.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update schools.json"
          git push
