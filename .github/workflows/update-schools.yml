name: Update schools.json

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate schools.json
        run: |
          python3 -c '
          import json
          import os
          from pathlib import Path

          schools = sorted(
              p.name
              for p in Path(".").iterdir()
              if (
                  p.is_dir()
                  and not p.name.startswith(".")
                  and p.name not in {"node_modules", "__pycache__"}
              )
          )

          existing = None
          if Path("schools.json").exists():
              with open("schools.json") as f:
                  existing = json.load(f)

          if existing != schools:
              with open("schools.json", "w") as f:
                  json.dump(schools, f, indent=2)
                  f.write("\n")
              print("updated")
          else:
              print("unchanged")
          '

      - name: Commit if changed
        run: |
          if git diff --quiet -- schools.json; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schools.json
          git commit -m "chore: update schools.json"
          git push
